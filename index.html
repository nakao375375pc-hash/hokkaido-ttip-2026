<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北海道旅行 2026</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="hero">
        <img src="images/hero.webp" alt="支笏湖の風景">
        <h1>北海道旅行 2026</h1>
        <p>美しい景色と美味しい食べ物を楽しむ旅</p>
    </section>

    <section class="hotel">
        <h2>ホテルアスペン</h2>
        <img src="images/hotel-aspen-exterior.webp" alt="ホテル外観">
        <img src="images/hotel-room.webp" alt="ホテルの部屋">
        <img src="images/hotel-buffet.webp" alt="朝食バイキング">
        <img src="images/hotel-food.webp" alt="料理">
    </section>

    <section class="sapporo-info">
        <h2>札幌プチ知識</h2>
        <img src="images/sapporo-origin.webp" alt="札幌の由来">
        <img src="images/sapporo-subway-tire.webp" alt="札幌地下鉄のタイヤ">
        <img src="images/sapporo-subway-surface.webp" alt="札幌地下鉄の路面">
        <img src="images/clark-statue.webp" alt="クラーク像">
    </section>

    <section class="thanks">
        <h2>ご挨拶</h2>
        <img src="images/thanks.webp" alt="赤レンガ庁舎">
        <p>北海道旅行の思い出をまとめました。ご覧いただきありがとうございます。</p>
    </section>

</body>
</html>
